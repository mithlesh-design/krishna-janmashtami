<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#143c68"/>
      <stop offset="60%" stop-color="#091f3a"/>
      <stop offset="100%" stop-color="#051224"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#FFF5DF" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#F4B942" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F4B942" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad2)"/>
  <circle cx="200" cy="160" r="130" fill="url(#sunGlow)"/>
  
  <!-- Kadamba tree branch & leaves -->
  <path d="M400 60 Q 320 70, 260 120 Q 210 160, 160 140" stroke="#F4B942" stroke-width="2.5" stroke-opacity="0.6" fill="none"/>
  <circle cx="260" cy="115" r="7" fill="#E879A9" opacity="0.8"/>
  <circle cx="240" cy="130" r="5" fill="#FBCFE8" opacity="0.85"/>
  <circle cx="290" cy="95" r="6" fill="#E879A9" opacity="0.8"/>
  
  <!-- Sacred Cow (Surabhi) Silhouette motif -->
  <g transform="translate(140, 240) scale(0.65)" opacity="0.85">
    <path d="M20 70 Q 30 20, 60 30 Q 90 20, 120 40 Q 150 40, 170 80 L 170 120 L 150 120 L 145 90 L 60 90 L 55 120 L 35 120 Z" fill="#FFF5DF"/>
    <!-- Horns -->
    <path d="M40 30 Q 30 5, 20 15 M 50 30 Q 55 5, 65 15" stroke="#F4B942" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Crown with Mor Pankh -->
  <g transform="translate(200, 100) scale(0.8)">
    <path d="M-30 40 L 0 0 L 30 40 Z" fill="#F4B942" opacity="0.9"/>
    <circle cx="0" cy="20" r="4" fill="#E879A9"/>
    <!-- Feather -->
    <path d="M0 0 Q 35 -40, 5 -75 Q -25 -40, 0 0" fill="#147b6a"/>
    <ellipse cx="6" cy="-45" rx="8" ry="12" fill="#123A68"/>
    <circle cx="6" cy="-45" r="4.5" fill="#F4B942"/>
  </g>

  <!-- Floating Petals -->
  <ellipse cx="100" cy="120" rx="8" ry="4" fill="#E879A9" transform="rotate(30 100 120)" opacity="0.75"/>
  <ellipse cx="320" cy="220" rx="7" ry="3.5" fill="#FBCFE8" transform="rotate(-25 320 220)" opacity="0.7"/>
</svg>
