<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad6" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#173e6b"/>
      <stop offset="55%" stop-color="#0b2241"/>
      <stop offset="100%" stop-color="#051224"/>
    </radialGradient>
    <radialGradient id="makhanGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#FFF5DF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FDE68A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#07182E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad6)"/>
  <circle cx="200" cy="200" r="130" fill="url(#makhanGlow)"/>

  <!-- Sacred Makhan Matki (Clay Pot of Butter) -->
  <g transform="translate(200, 210) scale(1.1)">
    <!-- Pot Body -->
    <path d="M-40 -20 C -70 10, -60 60, 0 65 C 60 60, 70 10, 40 -20 Z" fill="#8d4b2d" stroke="#F4B942" stroke-width="1.5"/>
    <ellipse cx="0" cy="-20" rx="42" ry="12" fill="#a45735" stroke="#F4B942" stroke-width="1.5"/>
    <!-- Overflowing Butter / Makhan -->
    <ellipse cx="0" cy="-23" rx="38" ry="10" fill="#FFF5DF"/>
    <path d="M-15 -18 C -10 0, 5 -5, 0 15 C -8 18, -18 5, -15 -18" fill="#FFF5DF"/>
    <!-- Sacred Tilak / Pattern on pot -->
    <path d="M-15 20 Q 0 35, 15 20" stroke="#F4B942" stroke-width="2" fill="none"/>
    <circle cx="0" cy="22" r="2.5" fill="#E879A9"/>
  </g>

  <!-- Peacock feather tucked behind the pot -->
  <g transform="translate(240, 110) rotate(20) scale(0.75)">
    <path d="M0 80 Q 25 20, 0 0 Q -25 20, 0 80" fill="#147b6a"/>
    <ellipse cx="0" cy="35" rx="10" ry="16" fill="#123A68"/>
    <circle cx="0" cy="35" r="5" fill="#F4B942"/>
    <path d="M0 80 L 0 140" stroke="#F4B942" stroke-width="2"/>
  </g>

  <!-- Starlight and Sparkles -->
  <circle cx="100" cy="100" r="2.5" fill="#FFF5DF" opacity="0.9"/>
  <circle cx="300" cy="90" r="2" fill="#FDE68A" opacity="0.8"/>
  <circle cx="90" cy="290" r="2" fill="#FDE68A" opacity="0.7"/>
  <circle cx="310" cy="280" r="2.5" fill="#FFF5DF" opacity="0.9"/>

  <text x="200" y="355" font-family="'Noto Serif Devanagari', serif" font-size="16" fill="#FFF5DF" opacity="0.9" text-anchor="middle" letter-spacing="3">यशोमति मैया से बोले नंदलाला</text>
</svg>
