<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad4" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#233a6b"/>
      <stop offset="60%" stop-color="#102042"/>
      <stop offset="100%" stop-color="#061226"/>
    </radialGradient>
    <radialGradient id="lotusGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#FBCFE8" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#E879A9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E879A9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad4)"/>
  <circle cx="200" cy="220" r="130" fill="url(#lotusGlow)"/>

  <!-- Divine Large Lotus in Full Bloom -->
  <g transform="translate(200, 240) scale(1.3)">
    <!-- Back petals -->
    <path d="M-60 -20 C -70 -60, -30 -80, 0 -70 C 30 -80, 70 -60, 60 -20 Z" fill="#b94a7a" opacity="0.6"/>
    <!-- Middle petals -->
    <path d="M-50 0 C -60 -45, -20 -65, 0 -50 C 20 -65, 60 -45, 50 0 Z" fill="#e26698" opacity="0.85"/>
    <path d="M-30 0 C -40 -35, -10 -55, 0 -40 C 10 -55, 40 -35, 30 0 Z" fill="#f48bb8" opacity="0.95"/>
    <!-- Front center petals -->
    <path d="M-15 0 C -20 -25, 0 -45, 0 -25 C 0 -45, 20 -25, 15 0 Z" fill="#FFF5DF"/>
    <!-- Lotus Center gold pod -->
    <circle cx="0" cy="-8" r="7" fill="#F4B942"/>
  </g>

  <!-- Sweet Flute resting above lotus -->
  <g transform="rotate(-15 200 120)">
    <rect x="90" y="115" width="220" height="10" rx="5" fill="#F4B942" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.5))"/>
    <circle cx="160" cy="120" r="2" fill="#07182E"/>
    <circle cx="185" cy="120" r="2" fill="#07182E"/>
    <circle cx="210" cy="120" r="2" fill="#07182E"/>
    <circle cx="235" cy="120" r="2" fill="#07182E"/>
    <!-- Feather tip -->
    <path d="M290 120 Q 320 90, 310 70 Q 285 90, 290 120" fill="#147b6a"/>
  </g>

  <text x="200" y="365" font-family="'Noto Serif Devanagari', serif" font-size="16" fill="#FDE68A" opacity="0.9" text-anchor="middle" letter-spacing="3">मधुराधिपतेरखिलं मधुरम्</text>
</svg>
