<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad5" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e3e68"/>
      <stop offset="55%" stop-color="#0e233f"/>
      <stop offset="100%" stop-color="#061224"/>
    </radialGradient>
    <radialGradient id="radheAura" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFF5DF" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#F4B942" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#E879A9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#07182E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad5)"/>
  <circle cx="200" cy="180" r="145" fill="url(#radheAura)"/>

  <!-- Twin Sacred Swans (Hamsa) / Radha Krishna unity emblem -->
  <g transform="translate(200, 180)">
    <!-- Divine arch -->
    <path d="M-90 40 C -90 -60, 90 -60, 90 40" stroke="#F4B942" stroke-width="2" stroke-opacity="0.4" fill="none"/>
    <path d="M-80 40 C -80 -50, 80 -50, 80 40" stroke="#FFF5DF" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.3" fill="none"/>

    <!-- Left Lotus & Right Lotus -->
    <g transform="translate(-45, 10) scale(0.65)">
      <path d="M0 -30 C -25 -10, -35 15, 0 30 C 35 15, 25 -10, 0 -30" fill="#E879A9"/>
      <path d="M0 -20 C -15 0, -20 15, 0 25 C 20 15, 15 0, 0 -20" fill="#FFF5DF"/>
    </g>
    <g transform="translate(45, 10) scale(0.65)">
      <path d="M0 -30 C -25 -10, -35 15, 0 30 C 35 15, 25 -10, 0 -30" fill="#123A68"/>
      <path d="M0 -20 C -15 0, -20 15, 0 25 C 20 15, 15 0, 0 -20" fill="#F4B942"/>
    </g>

    <!-- Center Flute and Peacock Feather -->
    <g transform="rotate(-30)">
      <rect x="-80" y="-4" width="160" height="8" rx="4" fill="#F4B942"/>
      <circle cx="-20" cy="0" r="1.5" fill="#07182E"/>
      <circle cx="0" cy="0" r="1.5" fill="#07182E"/>
      <circle cx="20" cy="0" r="1.5" fill="#07182E"/>
    </g>
  </g>

  <text x="200" y="355" font-family="'Noto Serif Devanagari', serif" font-size="20" fill="#FFF5DF" opacity="0.95" text-anchor="middle" letter-spacing="4">राधे राधे</text>
</svg>
