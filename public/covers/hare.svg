<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad3" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1b4578"/>
      <stop offset="60%" stop-color="#0e2849"/>
      <stop offset="100%" stop-color="#051325"/>
    </radialGradient>
    <radialGradient id="mahaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4B942" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#E879A9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#07182E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad3)"/>
  <circle cx="200" cy="200" r="150" fill="url(#mahaGlow)"/>

  <!-- Sacred Chant circle (Kirtan rhythm) -->
  <circle cx="200" cy="200" r="110" stroke="#FFF5DF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="8 6" fill="none"/>
  <circle cx="200" cy="200" r="85" stroke="#F4B942" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="16 8" fill="none"/>
  <circle cx="200" cy="200" r="60" stroke="#E879A9" stroke-opacity="0.4" stroke-width="1" fill="none"/>

  <!-- Sacred Tulsi Leaf motif -->
  <g transform="translate(200, 200) scale(1.1)">
    <path d="M0 -40 C -25 -20, -25 15, 0 35 C 25 15, 25 -20, 0 -40" fill="#2d7c58" opacity="0.9"/>
    <path d="M0 -35 L 0 30" stroke="#FDE68A" stroke-width="1.5" opacity="0.8"/>
    <path d="M0 -15 L -10 -5 M 0 0 L 10 8 M 0 15 L -10 22" stroke="#FDE68A" stroke-width="1" opacity="0.8"/>
  </g>

  <!-- Devotional symbols around -->
  <circle cx="200" cy="80" r="4" fill="#F4B942"/>
  <circle cx="200" cy="320" r="4" fill="#F4B942"/>
  <circle cx="80" cy="200" r="4" fill="#F4B942"/>
  <circle cx="320" cy="200" r="4" fill="#F4B942"/>
  
  <text x="200" y="365" font-family="'Noto Serif Devanagari', serif" font-size="16" fill="#FFF5DF" opacity="0.85" text-anchor="middle" letter-spacing="4">हरे कृष्ण हरे राम</text>
</svg>
