<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad1" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#19457a"/>
      <stop offset="50%" stop-color="#0f2b4c"/>
      <stop offset="100%" stop-color="#07182e"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F4B942" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F4B942" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldBar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DF"/>
      <stop offset="50%" stop-color="#F4B942"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad1)"/>
  <circle cx="200" cy="180" r="140" fill="url(#goldGlow)"/>
  
  <!-- Subtle mandala/halo ring -->
  <circle cx="200" cy="180" r="100" stroke="#F4B942" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
  <circle cx="200" cy="180" r="115" stroke="#FDE68A" stroke-opacity="0.15" stroke-width="1" fill="none"/>

  <!-- Flute (Bansuri) -->
  <g transform="rotate(-25 200 180)">
    <rect x="70" y="174" width="260" height="12" rx="6" fill="url(#goldBar)" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.5))"/>
    <!-- Flute holes -->
    <circle cx="160" cy="180" r="2.5" fill="#07182E"/>
    <circle cx="190" cy="180" r="2.5" fill="#07182E"/>
    <circle cx="220" cy="180" r="2.5" fill="#07182E"/>
    <circle cx="250" cy="180" r="2.5" fill="#07182E"/>
    <circle cx="280" cy="180" r="2.5" fill="#07182E"/>
    <!-- Flute tassels -->
    <path d="M75 186 C 70 210, 60 225, 65 245" stroke="#E879A9" stroke-width="2.5" fill="none"/>
    <circle cx="65" cy="248" r="4" fill="#F4B942"/>
  </g>

  <!-- Peacock Feather (Mor Pankh) -->
  <g transform="translate(190, 70) scale(0.9)">
    <path d="M0 80 Q 20 20, 0 0 Q -20 20, 0 80" fill="#123A68" opacity="0.9"/>
    <path d="M0 65 Q 14 25, 0 10 Q -14 25, 0 65" fill="#147b6a"/>
    <ellipse cx="0" cy="35" rx="10" ry="15" fill="#0d4e43"/>
    <ellipse cx="0" cy="33" rx="6" ry="9" fill="#123A68"/>
    <ellipse cx="0" cy="32" rx="3.5" ry="5" fill="#F4B942"/>
    <path d="M0 80 L 0 120" stroke="#F4B942" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Lotus Bloom at bottom -->
  <g transform="translate(200, 310) scale(0.85)">
    <path d="M0 -35 C -30 -10, -50 20, 0 35 C 50 20, 30 -10, 0 -35" fill="#E879A9" opacity="0.9"/>
    <path d="M0 -25 C -20 -5, -35 15, 0 30 C 35 15, 20 -5, 0 -25" fill="#FBCFE8" opacity="0.95"/>
    <path d="M0 -15 C -10 0, -18 15, 0 25 C 18 15, 10 0, 0 -15" fill="#FFF5DF"/>
  </g>

  <!-- Decorative Sparkles -->
  <circle cx="120" cy="110" r="2" fill="#FFF5DF" opacity="0.8"/>
  <circle cx="280" cy="120" r="2.5" fill="#FDE68A" opacity="0.9"/>
  <circle cx="100" cy="260" r="1.5" fill="#FFF5DF" opacity="0.6"/>
  <circle cx="310" cy="250" r="2" fill="#FDE68A" opacity="0.7"/>
</svg>
